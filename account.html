<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حسابي | نَحْنُ</title><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="styles.css"><style>.account-wrap{max-width:820px;margin:50px auto;padding:24px}.auth-card,.dash-card{background:#fff;border:1px solid #e5dced;border-radius:22px;padding:26px;margin:18px 0}.auth-card input{width:100%;box-sizing:border-box;padding:13px;margin:7px 0 14px;border:1px solid #d8cce2;border-radius:10px}.auth-actions{display:flex;gap:10px;flex-wrap:wrap}.status{margin-top:12px;color:#655b6d}.hidden{display:none}.chart{min-height:260px}</style></head><body><main class="account-wrap"><a class="brand" href="index.html"><span class="brand-mark"></span><span><strong>نَحْنُ</strong><small>الذئبة</small></span></a><section id="auth" class="auth-card"><h1>حسابي</h1><p>سجّل الدخول لحفظ متابعتك وعرض تغيّر النتائج مع الوقت.</p><label>البريد الإلكتروني<input id="email" type="email" autocomplete="email"></label><label>كلمة المرور<input id="password" type="password" autocomplete="current-password"></label><div class="auth-actions"><button class="button primary" id="login">تسجيل الدخول</button><button class="button secondary" id="signup">إنشاء حساب</button></div><p id="msg" class="status"></p></section><section id="dashboard" class="hidden"><div class="dash-card"><div class="auth-actions"><a class="button primary" href="assessment.html">ابدأ المتابعة</a><button class="button secondary" id="logout">تسجيل الخروج</button></div></div><div class="dash-card"><h2>نتائجي مع الوقت</h2><p>ستظهر هنا نتائج المتابعة المحفوظة كاتجاهات زمنية. هذه المتابعة لا تشخّص نشاط الذئبة ولا تحدد العلاج.</p><canvas id="trend" class="chart"></canvas></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script><script src="na7n-auth.js"></script><script>
const s=window.na7nSupabase,$=x=>document.getElementById(x);async function state(){const {data:{user}}=await s.auth.getUser();$("auth").classList.toggle("hidden",!!user);$("dashboard").classList.toggle("hidden",!user);if(user)load(user.id)}async function load(uid){const {data}=await s.from("na7n_responses").select("metric_key,value,created_at").eq("user_id",uid).order("created_at");if(!data||!data.length)return;const labels=[...new Set(data.map(x=>new Date(x.created_at).toLocaleDateString("ar-AE")))];const keys=[...new Set(data.map(x=>x.metric_key))];new Chart($("trend"),{type:"line",data:{labels,datasets:keys.map(k=>({label:k,data:labels.map(l=>{const x=data.filter(r=>r.metric_key===k&&new Date(r.created_at).toLocaleDateString("ar-AE")===l).at(-1);return x?Number(x.value):null}),tension:.25}))},options:{responsive:true,maintainAspectRatio:false}})}$("login").onclick=async()=>{let {error}=await s.auth.signInWithPassword({email:$("email").value,password:$("password").value});$("msg").textContent=error?error.message:"";if(!error)state()};$("signup").onclick=async()=>{let {error}=await s.auth.signUp({email:$("email").value,password:$("password").value});$("msg").textContent=error?error.message:"تم إنشاء الحساب. قد تحتاج إلى تأكيد البريد الإلكتروني."};$("logout").onclick=async()=>{await s.auth.signOut();state()};state();
</script></body></html>
