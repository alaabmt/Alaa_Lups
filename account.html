<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حسابي | نَحْنُ</title><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="styles.css"><style>.account-wrap{max-width:820px;margin:50px auto;padding:24px}.auth-card,.dash-card{background:#fff;border:1px solid #e5dced;border-radius:22px;padding:26px;margin:18px 0}.auth-card input{width:100%;box-sizing:border-box;padding:13px;margin:7px 0 14px;border:1px solid #d8cce2;border-radius:10px}.auth-actions{display:flex;gap:10px;flex-wrap:wrap}.status{margin-top:12px;color:#655b6d}.hidden{display:none}.chart-wrap{height:330px}.chart{width:100%!important;height:100%!important}.summary-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:18px 0}.summary-card{border:1px solid #e5dced;border-radius:16px;padding:16px;background:#fcfafd}.summary-card strong,.summary-card span{display:block}.summary-value{font-size:1.8rem;font-weight:900;color:var(--purple-dark);margin:8px 0 3px}.summary-change{font-size:.88rem;color:#655b6d}.empty-state{padding:22px;border:1px dashed #cdbbdd;border-radius:14px;text-align:center;color:#655b6d}@media(max-width:600px){.summary-grid{grid-template-columns:1fr}.chart-wrap{height:300px}}</style></head><body><main class="account-wrap"><a class="brand" href="index.html"><span class="brand-mark"></span><span><strong>نَحْنُ</strong><small>الذئبة</small></span></a><section id="auth" class="auth-card"><h1>حسابي</h1><p>سجّل الدخول لحفظ متابعتك وعرض تغيّر النتائج مع الوقت.</p><label>البريد الإلكتروني<input id="email" type="email" autocomplete="email"></label><label>كلمة المرور<input id="password" type="password" autocomplete="current-password"></label><div class="auth-actions"><button class="button primary" id="login">تسجيل الدخول</button><button class="button secondary" id="signup">إنشاء حساب</button></div><p id="msg" class="status"></p></section><section id="dashboard" class="hidden"><div class="dash-card"><div class="auth-actions"><a class="button primary" href="assessment.html">ابدأ المتابعة</a><button class="button secondary" id="logout">تسجيل الخروج</button></div></div><div class="dash-card"><h2>آخر متابعة</h2><div id="summary" class="summary-grid"></div><div id="empty" class="empty-state hidden">لا توجد نتائج محفوظة بعد. ابدأ أول متابعة لتظهر هنا.</div></div><div class="dash-card"><h2>التغيّر مع الوقت</h2><p>راقب الاتجاه بدل تفسير قراءة واحدة وحدها. هذه المتابعة تصف ما أبلغت عنه أنت ولا تشخّص نشاط الذئبة ولا تحدد العلاج.</p><div class="chart-wrap"><canvas id="trend" class="chart"></canvas></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script><script src="na7n-auth.js"></script><script>
const s=window.na7nSupabase,$=x=>document.getElementById(x);const metricNames={fatigue_impact:"تأثير التعب",sleep_impact:"تأثير النوم",daily_activity_impact:"تأثير الصحة على النشاط اليومي",quality_of_life:"جودة الحياة"};async function state(){const {data:{user}}=await s.auth.getUser();$("auth").classList.toggle("hidden",!!user);$("dashboard").classList.toggle("hidden",!user);if(user)load(user.id)}async function load(uid){const {data}=await s.from("na7n_responses").select("metric_key,value,created_at").eq("user_id",uid).order("created_at");if(!data||!data.length){$("empty").classList.remove("hidden");return}const byKey={};data.forEach(r=>(byKey[r.metric_key]??=[]).push(r));$("summary").innerHTML=Object.entries(metricNames).map(([k,n])=>{const a=byKey[k]||[];if(!a.length)return"";const last=a.at(-1),prev=a.length>1?a.at(-2):null,d=prev?Number(last.value)-Number(prev.value):null;return '<article class="summary-card"><strong>'+n+'</strong><span class="summary-value">'+Number(last.value).toFixed(1)+'/10</span><span class="summary-change">'+(d===null?"أول قراءة":d===0?"لا تغيير عن السابقة":(d>0?"+":"")+d.toFixed(1)+" عن السابقة")+'</span></article>'}).join("");const labels=[...new Set(data.map(x=>new Date(x.created_at).toLocaleDateString("ar-AE")))];const keys=[...new Set(data.map(x=>x.metric_key))];new Chart($("trend"),{type:"line",data:{labels,datasets:keys.map(k=>({label:metricNames[k]||k,data:labels.map(l=>{const x=data.filter(r=>r.metric_key===k&&new Date(r.created_at).toLocaleDateString("ar-AE")===l).at(-1);return x?Number(x.value):null}),tension:.25}))},options:{responsive:true,maintainAspectRatio:false}})}$("login").onclick=async()=>{let {error}=await s.auth.signInWithPassword({email:$("email").value,password:$("password").value});$("msg").textContent=error?error.message:"";if(!error)state()};$("signup").onclick=async()=>{let {error}=await s.auth.signUp({email:$("email").value,password:$("password").value});$("msg").textContent=error?error.message:"تم إنشاء الحساب. قد تحتاج إلى تأكيد البريد الإلكتروني."};$("logout").onclick=async()=>{await s.auth.signOut();state()};state();
</script></body></html>
